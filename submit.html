<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Submit a concern | UB Voice</title></head>
<body><a class="skip-link" href="#main">Skip to main content</a>
<header class="site" id="site-header"></header>
<main id="main"><section class="screen"><div class="container-lg"><div class="row justify-content-center"><div class="col-lg-8">
<h1 class="h2 mb-1">Submit a concern</h1>
<p class="text-secondary">Fields marked * are required. Prototype only: nothing is transmitted or stored.</p>
<div id="formAlert" role="status" tabindex="-1"></div>
<div class="form-card"><form id="concernForm" novalidate>
<div class="row g-3">
<div class="col-md-6"><label class="form-label" for="name">Full name (optional)</label><input class="form-control" id="name" autocomplete="name"></div>
<div class="col-md-6"><label class="form-label" for="email">Email (optional)</label><input class="form-control" id="email" type="email" autocomplete="email" aria-describedby="emailErr"><div class="invalid-feedback" id="emailErr"></div></div>
<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="anonymous"><label class="form-check-label" for="anonymous">Don't show my name</label></div></div>
<div class="col-12"><label class="form-label" for="category">Category *</label>
<select class="form-select" id="category" required aria-describedby="categoryErr"><option value="">Select a category</option><option>Campus facilities</option><option>Student services</option><option>Academic concern</option><option>Suggestion</option><option>Other</option></select>
<div class="invalid-feedback" id="categoryErr"></div></div>
<div class="col-12"><label class="form-label" for="message">Your message *</label>
<textarea class="form-control" id="message" rows="5" maxlength="500" required aria-describedby="messageErr count"></textarea>
<div class="d-flex justify-content-between"><div class="invalid-feedback d-block" id="messageErr"></div><span class="count" id="count">0 / 500</span></div></div>
</div>
<div class="d-flex gap-2 mt-3 form-actions"><button class="btn btn-red btn-lg" type="submit" id="submitBtn">Review and submit</button><button class="btn btn-outline-secondary btn-lg" type="button" id="clearBtn">Clear form</button></div>
</form></div>
</div></div></div></section></main>

<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
<div class="modal-header"><h2 class="modal-title h5" id="confirmTitle">Submit this concern?</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body"><p class="mb-1"><strong id="sumCat"></strong></p><p class="mb-0 text-secondary" id="sumMsg"></p></div>
<div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Go back and edit</button><button class="btn btn-red" id="confirmSend">Submit concern</button></div>
</div></div></div>
<footer class="site" id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script></body></html>
